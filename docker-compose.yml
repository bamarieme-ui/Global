services:

  node1:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    container_name: globalshop-node1
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5431:5432"
    volumes:
      - node1_data:/var/lib/postgresql/data
      - ./database/node1:/docker-entrypoint-initdb.d
    networks:
      - globalshop-network

  node2:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    container_name: globalshop-node2
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5432:5432"
    volumes:
      - node2_data:/var/lib/postgresql/data
      - ./database/node2:/docker-entrypoint-initdb.d
    networks:
      - globalshop-network

  node3:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    container_name: globalshop-node3
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5433:5432"
    volumes:
      - node3_data:/var/lib/postgresql/data
      - ./database/node3:/docker-entrypoint-initdb.d
    networks:
      - globalshop-network

  node4:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    container_name: globalshop-node4
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5434:5432"
    volumes:
      - node4_data:/var/lib/postgresql/data
      - ./database/node4:/docker-entrypoint-initdb.d
    networks:
      - globalshop-network



  router:
    build:
      context: ./router
    container_name: globalshop-router
    ports:
      - "8000:8000"
    depends_on:
      - node1
      - node2
      - node3
      - node4
    networks:
      - globalshop-network





volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:


networks:
  globalshop-network:
    driver: bridge